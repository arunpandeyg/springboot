<!doctype html>
<html lang="en" xmlns:th="http://www.thyme.org"
      th:replace="signup :: signupSection">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Smart Contact Manager</title>
</head>
<body>

<section th:fragment="signupSection">
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="my-card mt-2">

                    <div th:if="${session.message}" th:classappend="${session.message.type}" class="alert " role="alert">
                        <p class="text-center" th:text="${session.message.content}"></p>
                        <th:block th:text="${#session.removeAttribute('message')}"></th:block>
                    </div>

                    <div class="container text-center">
                        <img  style="width: 60px" src="" th:src="@{/img/cr.jpg}" alt="">
                    </div>


                    <h1 class="text-center">Register Here !!</h1>
                    <form action="" th:action="@{/do_register}" method="post" th:object="${user}" >
                       <!-- Name field-->
                        <div class="form-group">
                            <label for="Name-field" class="form-label">Your Name</label>
                            <input
                                    name="name"
                                    type="text"
                                    class="form-control"
                                    th:classappend="${#fields.hasErrors('name' ? 'is-invalid' : '')}"
                                    id="Name-field"
                                    aria-describedby="emailHelp"
                                    placeholder="Enter here"
                                    required
                                    th:value="${user.name}"
                            />
                            <div class="invalid-feedback" th:each="e : ${#fields.errors('name')}" th:text="${e}">

                            </div>


                        </div>
                        <!-- Email field-->
                        <div class="form-group">
                            <label for="Email-field" class="form-label">Your Email</label>
                            <input
                                    name="email"
                                    type="email"
                                    class="form-control"
                                    id="Email-field"
                                    aria-describedby="emailHelp"
                                    placeholder="Enter here"
                                    required
                                    th:value="${user.email}"
                            />


                        </div>
                        <!-- Password field-->
                        <div class="form-group">
                            <label for="Password-field" class="form-label">Your Password</label>
                            <input
                                    name="password"
                                    type="password"
                                    class="form-control"
                                    id="Password-field"
                                    aria-describedby="emailHelp"
                                    placeholder="Enter here"
                                    required

                            />


                        </div>
                        <!-- About field-->
                        <div class="form-group">
                            <textarea name="about" th:value="${user.about}"
                                      placeholder="Describe yourself here"
                                      rows="6" class="form-control"></textarea>

                        </div>
                        <!--Terms and condition agreement -->
                        <div class="form-group form-check text-center">
                            <input type="checkbox"
                            name="agreement"
                            class="form-check-input"
                            id="agreement"
                            />
                            <label for="agreement">Accept terms and conditions</label>
                        </div>
                        <div class="container text-center">
                            <button type="submit" class="btn bg-primary text-white">
                                Submit
                            </button>
                            <button type="reset" class="btn btn-warning">
                                Reset
                            </button>

                        </div>

                    </form>
                </div>


            </div>

        </div>
    </div>


</section>

</body>
</html>
